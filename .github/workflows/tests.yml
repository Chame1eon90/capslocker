name: Проверка раскладки

on:
  push:
    paths: ["common/core.py", "common/layouts.py", "tests/**", ".github/workflows/tests.yml"]
  pull_request:
    paths: ["common/core.py", "common/layouts.py", "tests/**", ".github/workflows/tests.yml"]

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyspellchecker
      - run: python -m unittest discover -s tests -v
