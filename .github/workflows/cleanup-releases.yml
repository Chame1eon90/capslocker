name: Удаление старых сборок

on:
  push:
    branches: [main]
    paths: [".github/workflows/cleanup-releases.yml"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Удалить сборки 1–9, первые сборки для Mac и build-027
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          for tag in build-1 build-2 build-3 build-4 build-5 build-6 build-7 build-8 build-9 \
                     mac-build-1 mac-build-2 mac-build-3 mac-build-4 mac-build-5 mac-build-6 mac-build-7 build-027; do
            out=$(gh release delete "$tag" --cleanup-tag --yes --repo "${{ github.repository }}" 2>&1) \
              && echo "::notice::удалено $tag" || echo "::warning::$tag: ${out//$'\n'/ }"
          done
