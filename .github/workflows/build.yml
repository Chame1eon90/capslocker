name: Сборка (Windows и macOS)

on:
  push:
    branches: [main]
    paths: ["mac/**", "windows/**", ".github/workflows/build.yml"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            label: Apple-M
          - runner: macos-15-intel
            label: Intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python 3.12 с python.org (с Tk для окна)
        run: |
          curl -sSL -o py.pkg https://www.python.org/ftp/python/3.12.10/python-3.12.10-macos11.pkg
          sudo installer -pkg py.pkg -target /
          echo "/Library/Frameworks/Python.framework/Versions/3.12/bin" >> "$GITHUB_PATH"

      - name: Библиотеки
        run: |
          python3.12 -m pip install --upgrade pip
          python3.12 -m pip install pyinstaller customtkinter pyperclip certifi pillow pyspellchecker tokenizers \
            ctranslate2 sentencepiece \
            pyobjc-core pyobjc-framework-Quartz pyobjc-framework-Cocoa pyobjc-framework-ApplicationServices

      - name: Проверка, что всё импортируется
        working-directory: mac
        run: |
          python3.12 -c "import tkinter, customtkinter, ctranslate2, sentencepiece, Quartz, AppKit, ApplicationServices; print('tk', tkinter.TkVersion)"
          python3.12 -c "import mac_input, layouts, core; print('mac_input ok')"

      - name: Сборка Капслокер.app
        working-directory: mac
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          echo "BUILD = ${{ github.run_number }}" > build_info.py
          python3.12 -m PyInstaller --noconfirm --windowed --name Capslocker \
            --icon icon.png --osx-bundle-identifier com.capslocker.app \
            --add-data "icon.png:." \
            --collect-all customtkinter --collect-all ctranslate2 \
            --collect-binaries sentencepiece --hidden-import sentencepiece \
            --hidden-import Quartz --hidden-import AppKit --hidden-import ApplicationServices \
            --hidden-import CoreFoundation --hidden-import certifi \
            --collect-data spellchecker --hidden-import tokenizers \
            --exclude-module ctranslate2.converters \
            app_mac.py
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Капслокер" dist/Capslocker.app/Contents/Info.plist || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string Капслокер" dist/Capslocker.app/Contents/Info.plist
          if [ -n "$MAC_CERT_P12" ]; then
            # постоянная подпись: macOS узнаёт программу после обновлений и не сбрасывает разрешения
            echo "$MAC_CERT_P12" | base64 --decode > cert.p12
            KC="$RUNNER_TEMP/sign.keychain-db"
            security create-keychain -p kcpass "$KC"
            security set-keychain-settings -lut 3600 "$KC"
            security unlock-keychain -p kcpass "$KC"
            security import cert.p12 -k "$KC" -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign
            security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k kcpass "$KC" >/dev/null
            openssl pkcs12 -in cert.p12 -nokeys -passin pass:"$MAC_CERT_PASSWORD" -legacy -out cert.pem 2>/dev/null || \
              openssl pkcs12 -in cert.p12 -nokeys -passin pass:"$MAC_CERT_PASSWORD" -out cert.pem
            sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain cert.pem
            HASH=$(security find-certificate -c "Capslocker Self-Signed" -Z "$KC" | awk '/SHA-1/{print $NF}')
            codesign --force --deep --sign "$HASH" --keychain "$KC" --identifier com.capslocker.app dist/Capslocker.app
            codesign -dv --verbose=2 dist/Capslocker.app 2>&1 | grep -E "Authority|Identifier" || true
            codesign -d -r- dist/Capslocker.app 2>&1 | tail -1
            echo "::notice title=Подпись Mac::постоянная подпись (Capslocker Self-Signed)"
            rm -f cert.p12 cert.pem
          else
            codesign --force --deep --sign - dist/Capslocker.app
            echo "::warning title=Подпись Mac::секрета MAC_CERT_P12 нет — временная подпись, разрешения будут сбрасываться"
          fi
          cd dist && ditto -c -k --keepParent Capslocker.app "../../Capslocker-macOS-${{ matrix.label }}.zip"

      - name: Пробный запуск (программа должна стартовать и не упасть сразу)
        run: |
          ./mac/dist/Capslocker.app/Contents/MacOS/Capslocker &
          PID=$!
          sleep 15
          if kill -0 $PID 2>/dev/null; then echo "Запустилась и работает"; kill $PID; else echo "Упала при запуске"; cat "$HOME/Library/Application Support/Capslocker/log.txt" || true; exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: Capslocker-macOS-${{ matrix.label }}
          path: Capslocker-macOS-${{ matrix.label }}.zip

      - name: Выложить в Releases (не дожидаясь других систем)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="build-${{ github.run_number }}"
          # «Что нового»: из .github/release-notes.json, если там есть эта сборка, иначе — список изменений с прошлой сборки
          PYBIN=$(command -v python3 || command -v python)
          "$PYBIN" - "$TAG" > notes.md <<'PY'
          import json, subprocess, sys
          tag = sys.argv[1]
          try:
              print(json.load(open(".github/release-notes.json", encoding="utf-8"))[tag]); sys.exit()
          except (KeyError, OSError, ValueError):
              pass
          tags = subprocess.run(["git", "tag", "-l", "build-*", "--sort=-v:refname"], capture_output=True, text=True).stdout.split()
          prev = next((t for t in tags if t != tag), None)
          rng = [f"{prev}..HEAD"] if prev else ["-1"]
          log = subprocess.run(["git", "log", "--format=%s"] + rng, capture_output=True, text=True, encoding="utf-8").stdout
          items = [l for l in log.splitlines() if l.strip() and not l.startswith(("CI:", "Запуск сборки"))]
          print("## Что нового\n" + "\n".join("- " + l for l in reversed(items)) + "\n")
          print("Windows — Capslocker-Windows.zip. Mac: Apple-M — чипы M1–M4, Intel — старые Mac. Файлы появляются по мере готовности.")
          PY
          cat notes.md
          gh release create "$TAG" --repo "${{ github.repository }}" --title "Капслокер (сборка ${{ github.run_number }})" \
            --notes-file notes.md || true
          gh release upload "$TAG" "Capslocker-macOS-${{ matrix.label }}.zip" --repo "${{ github.repository }}" --clobber

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Библиотеки
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller customtkinter keyboard pyperclip pystray pillow ctranslate2 sentencepiece pyspellchecker tokenizers
      - name: Сборка Capslocker.exe
        working-directory: windows
        shell: pwsh
        run: |
          Set-Content -Path build_info.py -Value "BUILD = ${{ github.run_number }}" -Encoding ascii
          Expand-Archive llama_runtime.zip -DestinationPath llama
          python -m PyInstaller --noconfirm --onefile --windowed --name Capslocker --icon icon.ico `
            --add-data "icon.ico;." --add-data "tray_on.png;." --add-data "tray_off.png;." --add-data "llama;llama" `
            --collect-all customtkinter --collect-all ctranslate2 --collect-binaries sentencepiece `
            --hidden-import sentencepiece --hidden-import pyperclip --hidden-import keyboard `
            --collect-data spellchecker --hidden-import tokenizers `
            --hidden-import pystray._win32 --exclude-module matplotlib --exclude-module ctranslate2.converters app.py
      - name: Пробный запуск (должна стартовать и не упасть сразу)
        working-directory: windows
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\Capslocker.exe -PassThru
          Start-Sleep -Seconds 25
          if ($p.HasExited) { $l = Get-Content "$env:LOCALAPPDATA\Capslocker\log.txt" -ErrorAction SilentlyContinue | Out-String; Write-Host "::error title=Запуск::Упала при запуске | $($l -replace "`r?`n", ' | ')"; exit 1 }
          Write-Host "Запустилась и работает"
          Get-Process Capslocker -ErrorAction SilentlyContinue | Stop-Process -Force
          Get-Process llama-server -ErrorAction SilentlyContinue | Stop-Process -Force
      - name: Проверка замены файла при обновлении
        working-directory: windows
        shell: pwsh
        run: |
          $t = Join-Path $env:RUNNER_TEMP "upd"; New-Item -ItemType Directory -Force $t | Out-Null
          Copy-Item "$env:SystemRoot\System32\whoami.exe" "$t\Capslocker.exe"
          New-Item -ItemType Directory -Force "$t\pkg\Капслокер" | Out-Null
          Copy-Item "$env:SystemRoot\System32\hostname.exe" "$t\pkg\Капслокер\Capslocker.exe"
          Compress-Archive -Path "$t\pkg\Капслокер" -DestinationPath "$t\new.zip" -Force
          $py = @"
          import sys, updater
          sys.executable = r'$t\Capslocker.exe'
          updater.install_and_restart(r'$t\new.zip')
          print('replacer started')
          "@
          # 1) сам скрипт замены, синхронно (pid несуществующий — сразу к замене)
          $py0 = @"
          import updater, os
          open(r'$t\sync.ps1','w',encoding='utf-8-sig').write(updater.windows_script(999999, r'$t\sync_target.exe', r'$t\sync_new.exe', r'$t\syncwork', r'$t\sync.log'))
          "@
          Copy-Item "$env:SystemRoot\System32\whoami.exe" "$t\sync_target.exe"
          Copy-Item "$env:SystemRoot\System32\hostname.exe" "$t\sync_new.exe"
          python -c $py0
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$t\sync.ps1"
          $sl = Get-Content "$t\sync.log" -ErrorAction SilentlyContinue | Out-String
          Write-Host "::notice title=sync script::$($sl -replace "`r?`n", ' | ')"
          Get-Process hostname,sync_target -ErrorAction SilentlyContinue | Stop-Process -Force
          # 2) как в программе: отдельный процесс
          $out = python -c $py 2>&1 | Out-String
          Write-Host "::notice title=updater python::$($out -replace "`r?`n", ' | ')"
          Start-Sleep -Seconds 15
          $log = Get-Content "$env:LOCALAPPDATA\Capslocker\update.log" -ErrorAction SilentlyContinue | Out-String
          Write-Host "::notice title=update.log::$($log -replace "`r?`n", ' | ')"
          $a = (Get-FileHash "$t\Capslocker.exe").Hash; $b = (Get-FileHash "$env:SystemRoot\System32\hostname.exe").Hash
          if ($a -ne $b) { Write-Host "::error title=Обновление::Файл НЕ заменён"; exit 1 }
          Write-Host "::notice title=Обновление::Замена работает"

      - name: Перезапуск после обновления (без чужих настроек PyInstaller)
        working-directory: windows
        shell: pwsh
        run: |
          Get-Process Capslocker,llama-server -ErrorAction SilentlyContinue | Stop-Process -Force
          $py = @"
          import os, subprocess, sys, time, updater
          # как будто нас запустила старая версия: подсовываем её служебные переменные
          os.environ['_PYI_APPLICATION_HOME_DIR'] = r'C:\nonexistent\_MEI_old'
          os.environ['_PYI_ARCHIVE_FILE'] = r'C:\nonexistent\old.exe'
          os.environ['_PYI_PARENT_PROCESS_LEVEL'] = '1'
          p = subprocess.Popen([r'dist\Capslocker.exe'], env=updater.clean_env())
          time.sleep(25)
          alive = p.poll() is None
          print('ALIVE' if alive else 'DEAD rc=%s' % p.returncode)
          if alive:
              p.kill()
          sys.exit(0 if alive else 1)
          "@
          python -c $py
          if ($LASTEXITCODE -ne 0) { Write-Host "::error title=Перезапуск::Новая версия не запустилась"; exit 1 }
          Write-Host "::notice title=Перезапуск::Новая версия запускается"
          Get-Process Capslocker,llama-server -ErrorAction SilentlyContinue | Stop-Process -Force

      - name: Архив
        working-directory: windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force pkg\Капслокер | Out-Null
          Copy-Item dist\Capslocker.exe pkg\Капслокер\
          Copy-Item "Инструкция.txt" pkg\Капслокер\
          Copy-Item icon.png "pkg\Капслокер\Капслокер icon.png"
          Compress-Archive -Path pkg\Капслокер -DestinationPath ..\Capslocker-Windows.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Capslocker-Windows
          path: Capslocker-Windows.zip

      - name: Выложить в Releases (не дожидаясь Mac)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="build-${{ github.run_number }}"
          # «Что нового»: из .github/release-notes.json, если там есть эта сборка, иначе — список изменений с прошлой сборки
          PYBIN=$(command -v python3 || command -v python)
          "$PYBIN" - "$TAG" > notes.md <<'PY'
          import json, subprocess, sys
          tag = sys.argv[1]
          try:
              print(json.load(open(".github/release-notes.json", encoding="utf-8"))[tag]); sys.exit()
          except (KeyError, OSError, ValueError):
              pass
          tags = subprocess.run(["git", "tag", "-l", "build-*", "--sort=-v:refname"], capture_output=True, text=True).stdout.split()
          prev = next((t for t in tags if t != tag), None)
          rng = [f"{prev}..HEAD"] if prev else ["-1"]
          log = subprocess.run(["git", "log", "--format=%s"] + rng, capture_output=True, text=True, encoding="utf-8").stdout
          items = [l for l in log.splitlines() if l.strip() and not l.startswith(("CI:", "Запуск сборки"))]
          print("## Что нового\n" + "\n".join("- " + l for l in reversed(items)) + "\n")
          print("Windows — Capslocker-Windows.zip. Mac: Apple-M — чипы M1–M4, Intel — старые Mac. Файлы появляются по мере готовности.")
          PY
          cat notes.md
          gh release create "$TAG" --repo "${{ github.repository }}" --title "Капслокер (сборка ${{ github.run_number }})" \
            --notes-file notes.md || true
          gh release upload "$TAG" Capslocker-Windows.zip --repo "${{ github.repository }}" --clobber
