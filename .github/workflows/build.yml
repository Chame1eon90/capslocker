name: Сборка (Windows и macOS)

on:
  push:
    branches: [main]
    paths: ["mac/**", "windows/**", ".github/workflows/build.yml"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            label: Apple-M
          - runner: macos-15-intel
            label: Intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Python 3.12 с python.org (с Tk для окна)
        run: |
          curl -sSL -o py.pkg https://www.python.org/ftp/python/3.12.10/python-3.12.10-macos11.pkg
          sudo installer -pkg py.pkg -target /
          echo "/Library/Frameworks/Python.framework/Versions/3.12/bin" >> "$GITHUB_PATH"

      - name: Библиотеки
        run: |
          python3.12 -m pip install --upgrade pip
          python3.12 -m pip install pyinstaller customtkinter pyperclip certifi pillow \
            ctranslate2 sentencepiece \
            pyobjc-core pyobjc-framework-Quartz pyobjc-framework-Cocoa pyobjc-framework-ApplicationServices

      - name: Проверка, что всё импортируется
        working-directory: mac
        run: |
          python3.12 -c "import tkinter, customtkinter, ctranslate2, sentencepiece, Quartz, AppKit, ApplicationServices; print('tk', tkinter.TkVersion)"
          python3.12 -c "import mac_input, layouts, core; print('mac_input ok')"

      - name: Сборка Капслокер.app
        working-directory: mac
        run: |
          echo "BUILD = ${{ github.run_number }}" > build_info.py
          python3.12 -m PyInstaller --noconfirm --windowed --name Capslocker \
            --icon icon.png --osx-bundle-identifier com.capslocker.app \
            --add-data "icon.png:." \
            --collect-all customtkinter --collect-all ctranslate2 \
            --collect-binaries sentencepiece --hidden-import sentencepiece \
            --hidden-import Quartz --hidden-import AppKit --hidden-import ApplicationServices \
            --hidden-import CoreFoundation --hidden-import certifi \
            --exclude-module ctranslate2.converters \
            app_mac.py
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Капслокер" dist/Capslocker.app/Contents/Info.plist || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string Капслокер" dist/Capslocker.app/Contents/Info.plist
          codesign --force --deep --sign - dist/Capslocker.app
          cd dist && ditto -c -k --keepParent Capslocker.app "../../Capslocker-macOS-${{ matrix.label }}.zip"

      - name: Пробный запуск (программа должна стартовать и не упасть сразу)
        run: |
          ./mac/dist/Capslocker.app/Contents/MacOS/Capslocker &
          PID=$!
          sleep 15
          if kill -0 $PID 2>/dev/null; then echo "Запустилась и работает"; kill $PID; else echo "Упала при запуске"; cat "$HOME/Library/Application Support/Capslocker/log.txt" || true; exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: Capslocker-macOS-${{ matrix.label }}
          path: Capslocker-macOS-${{ matrix.label }}.zip

      - name: Выложить в Releases (не дожидаясь других систем)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" --repo "${{ github.repository }}" --title "Капслокер (сборка ${{ github.run_number }})" \
            --notes "Windows — Capslocker-Windows.zip. Mac: Apple-M — чипы M1–M4, Intel — старые Mac. Файлы появляются по мере готовности." || true
          gh release upload "$TAG" "Capslocker-macOS-${{ matrix.label }}.zip" --repo "${{ github.repository }}" --clobber

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Библиотеки
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller customtkinter keyboard pyperclip pystray pillow ctranslate2 sentencepiece
      - name: Сборка Capslocker.exe
        working-directory: windows
        shell: pwsh
        run: |
          Set-Content -Path build_info.py -Value "BUILD = ${{ github.run_number }}" -Encoding ascii
          Expand-Archive llama_runtime.zip -DestinationPath llama
          python -m PyInstaller --noconfirm --onefile --windowed --name Capslocker --icon icon.ico `
            --add-data "icon.ico;." --add-data "tray_on.png;." --add-data "tray_off.png;." --add-data "llama;llama" `
            --collect-all customtkinter --collect-all ctranslate2 --collect-binaries sentencepiece `
            --hidden-import sentencepiece --hidden-import pyperclip --hidden-import keyboard `
            --hidden-import pystray._win32 --exclude-module matplotlib --exclude-module ctranslate2.converters app.py
      - name: Пробный запуск (должна стартовать и не упасть сразу)
        working-directory: windows
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\Capslocker.exe -PassThru
          Start-Sleep -Seconds 25
          if ($p.HasExited) { Write-Host "Упала при запуске"; Get-Content "$env:LOCALAPPDATA\Capslocker\log.txt" -ErrorAction SilentlyContinue; exit 1 }
          Write-Host "Запустилась и работает"
          Get-Process Capslocker -ErrorAction SilentlyContinue | Stop-Process -Force
          Get-Process llama-server -ErrorAction SilentlyContinue | Stop-Process -Force
      - name: Проверка замены файла при обновлении
        working-directory: windows
        shell: pwsh
        run: |
          $t = Join-Path $env:RUNNER_TEMP "upd"; New-Item -ItemType Directory -Force $t | Out-Null
          Copy-Item "$env:SystemRoot\System32\whoami.exe" "$t\Capslocker.exe"
          New-Item -ItemType Directory -Force "$t\pkg\Капслокер" | Out-Null
          Copy-Item "$env:SystemRoot\System32\hostname.exe" "$t\pkg\Капслокер\Capslocker.exe"
          Compress-Archive -Path "$t\pkg\Капслокер" -DestinationPath "$t\new.zip" -Force
          $py = @"
          import sys, updater
          sys.executable = r'$t\Capslocker.exe'
          updater.install_and_restart(r'$t\new.zip')
          print('replacer started')
          "@
          python -c $py
          Start-Sleep -Seconds 12
          Get-Content "$env:LOCALAPPDATA\Capslocker\update.log" -ErrorAction SilentlyContinue
          $a = (Get-FileHash "$t\Capslocker.exe").Hash; $b = (Get-FileHash "$env:SystemRoot\System32\hostname.exe").Hash
          if ($a -ne $b) { Write-Host "Файл НЕ заменён"; exit 1 }
          Write-Host "Замена работает"

      - name: Архив
        working-directory: windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force pkg\Капслокер | Out-Null
          Copy-Item dist\Capslocker.exe pkg\Капслокер\
          Copy-Item "Инструкция.txt" pkg\Капслокер\
          Copy-Item icon.png "pkg\Капслокер\Капслокер icon.png"
          Compress-Archive -Path pkg\Капслокер -DestinationPath ..\Capslocker-Windows.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Capslocker-Windows
          path: Capslocker-Windows.zip

      - name: Выложить в Releases (не дожидаясь Mac)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" --repo "${{ github.repository }}" --title "Капслокер (сборка ${{ github.run_number }})" \
            --notes "Windows — Capslocker-Windows.zip. Mac: Apple-M — чипы M1–M4, Intel — старые Mac. Файлы появляются по мере готовности." || true
          gh release upload "$TAG" Capslocker-Windows.zip --repo "${{ github.repository }}" --clobber
